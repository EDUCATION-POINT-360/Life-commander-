<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <title>Offline Mode — LIFE COMMANDER</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png">
  <style>
    :root {
      --bg-primary: #101010;
      --bg-secondary: #1B1B1B;
      --card-bg: #222222;
      --border-color: #383838;
      --accent-red: #E53935;
      --accent-gold: #FFC857;
      --text-primary: #FFFFFF;
      --text-secondary: #AAAAAA;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .offline-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 36px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
    }
    .badge {
      display: inline-block;
      background: rgba(255, 200, 87, 0.15);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .logo-img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 2px solid var(--accent-gold);
      margin-bottom: 20px;
      object-fit: cover;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-secondary);
      margin-bottom: 28px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent-red);
      color: #FFFFFF;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 14px;
      border: none;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: var(--bg-secondary);
      color: var(--accent-gold);
      border: 1px solid var(--accent-gold);
      margin-top: 12px;
    }
    .offline-tip {
      margin-top: 24px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <div class="badge">Offline Operations Active</div>
    <div>
      <img src="/icons/icon-192x192.png" alt="Life Commander" class="logo-img">
    </div>
    <h1>You are Currently Offline</h1>
    <p>Life Commander continues working offline for your essential routine: your 6h study targets, wife time records, sleep schedules, and prayers remain saved locally.</p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
    <button class="btn btn-secondary" onclick="window.location.href='/'">Go to Commander Dashboard</button>
    <div class="offline-tip">Your local data will automatically synchronize once connection is re-established.</div>
  </div>
</body>
</html>
